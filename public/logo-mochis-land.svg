<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mochi's Land">
  <defs>
    <radialGradient id="sky" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#92e7f6"/>
      <stop offset="55%" stop-color="#62d3ec"/>
      <stop offset="100%" stop-color="#44b8d8"/>
    </radialGradient>
    <radialGradient id="pink" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffc2d4"/>
      <stop offset="60%" stop-color="#ef7fb3"/>
      <stop offset="100%" stop-color="#c94882"/>
    </radialGradient>
    <radialGradient id="sun" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff29b"/>
      <stop offset="60%" stop-color="#ffd64d"/>
      <stop offset="100%" stop-color="#f19b38"/>
    </radialGradient>
    <radialGradient id="leaf" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b6ead2"/>
      <stop offset="65%" stop-color="#72b99b"/>
      <stop offset="100%" stop-color="#3c806c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#263349" flood-opacity="0.22"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#sky)"/>
  <circle cx="98" cy="126" r="44" fill="#ffffff" opacity="0.24"/>
  <circle cx="406" cy="164" r="56" fill="#ffffff" opacity="0.18"/>
  <circle cx="390" cy="388" r="34" fill="#ffffff" opacity="0.16"/>

  <g filter="url(#shadow)">
    <path d="M164 330 C138 300 146 256 182 238 C202 190 264 170 310 198 C360 190 404 224 408 272 C434 292 428 338 392 354 C356 396 230 398 184 354 C178 346 170 338 164 330 Z" fill="#ffffff"/>
    <ellipse cx="250" cy="398" rx="122" ry="22" fill="#20304a" opacity="0.14"/>
  </g>

  <g transform="translate(176 122) rotate(-12)">
    <ellipse cx="0" cy="0" rx="50" ry="40" fill="url(#pink)"/>
    <ellipse cx="-14" cy="-12" rx="14" ry="8" fill="#fff" opacity="0.48"/>
    <circle cx="-16" cy="4" r="3" fill="#b83d71" opacity="0.20"/>
    <circle cx="11" cy="13" r="2.6" fill="#b83d71" opacity="0.18"/>
  </g>

  <g transform="translate(316 338) rotate(11)">
    <ellipse cx="0" cy="0" rx="58" ry="40" fill="url(#sun)"/>
    <ellipse cx="-16" cy="-12" rx="16" ry="9" fill="#fff" opacity="0.40"/>
    <circle cx="18" cy="8" r="3" fill="#b26a26" opacity="0.20"/>
    <circle cx="-4" cy="18" r="2.4" fill="#b26a26" opacity="0.16"/>
  </g>

  <g transform="translate(118 300) rotate(24)">
    <path d="M-58 12 C-34 -38 32 -48 62 -8 C42 34 -2 52 -58 12 Z" fill="url(#leaf)"/>
    <path d="M-38 -2 C-12 -20 22 -18 42 -4" fill="none" stroke="#e8fff4" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g transform="translate(390 246) rotate(20)">
    <ellipse cx="0" cy="0" rx="40" ry="32" fill="#d8ecff"/>
    <ellipse cx="-10" cy="-10" rx="11" ry="7" fill="#fff" opacity="0.52"/>
    <path d="M-22 6 C-2 -8 20 -6 30 6" fill="none" stroke="#75a9db" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <text x="256" y="262" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, Arial, sans-serif" font-size="70" font-weight="900" fill="#20304a" letter-spacing="-3">Mochi's</text>
  <text x="256" y="326" text-anchor="middle" font-family="Arial Rounded MT Bold, Trebuchet MS, Arial, sans-serif" font-size="82" font-weight="900" fill="#20304a" letter-spacing="-4">land</text>
  <text x="256" y="364" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="24" font-weight="700" fill="#4d679b" letter-spacing="2">japanese dessert</text>
