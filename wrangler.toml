name = "mymochis"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[vars]
ENVIRONMENT = "production"

[durable_objects]
bindings = []

[[d1_databases]]
binding = "DB"
database_name = "mymochis"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "mymochis-uploads"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
