services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - mymochis_data:/var/data
    expose:
      - "3737"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  mymochis_data:
  caddy_data:
  caddy_config:
