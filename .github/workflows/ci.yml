name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: "Suite de regresion (131 tests: pagos, stock, domicilio, produccion)"
        run: npm test

      - name: Compilar las islas React (shader + motion)
        run: npm run build:web

      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: "E2E de landing y tienda (3 viewports)"
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
